<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-Bot 系統監測與 Log 控制台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        cardBg: '#121215',
                        borderBg: '#27272a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        /* 自訂極簡滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
        .dot-online {
            background-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }
        .dot-offline {
            background-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }
    </style>

    <!-- 初始化主題設定 (避免亮暗色切換閃爍) -->
    <script>
        if (localStorage.getItem('bbot_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-zinc-100 dark:bg-darkBg text-zinc-800 dark:text-zinc-200 font-sans min-h-screen antialiased flex flex-col selection:bg-zinc-300 dark:selection:bg-zinc-800 selection:text-zinc-900 dark:selection:text-white transition-colors duration-200">

    <!-- 登入介面 (Auth Screen) -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-zinc-900/60 dark:bg-darkBg/95 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800/90 rounded-xl max-w-sm w-full p-6 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-full flex items-center justify-center mx-auto text-zinc-700 dark:text-zinc-300">
                    <i class="fa-solid fa-lock text-lg"></i>
                </div>
                <h2 class="text-lg font-semibold text-zinc-900 dark:text-white tracking-wide">B-Bot 系統權限驗證</h2>
                <p class="text-xs text-zinc-500 font-sans">請輸入身份存取密碼以繼續</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label for="password-input" class="block text-[11px] font-mono uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">存取密碼 Passcode</label>
                    <input type="password" id="password-input" placeholder="請輸入密碼" autofocus autocomplete="off" class="w-full px-3.5 py-2 bg-zinc-50 dark:bg-zinc-900 border border-zinc-300 dark:border-zinc-800 rounded-lg text-sm text-zinc-900 dark:text-white placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition font-mono tracking-widest text-center">
                </div>

                <!-- 錯誤訊息提示 -->
                <div id="login-error" class="hidden text-xs text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/50 px-3 py-2 rounded-lg text-center font-mono">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> 密碼錯誤，請重新輸入！
                </div>

                <button type="submit" class="w-full py-2 bg-zinc-900 hover:bg-zinc-800 text-white dark:bg-zinc-200 dark:hover:bg-white dark:text-zinc-900 font-medium text-xs rounded-lg transition duration-200 focus:outline-none cursor-pointer">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 頂部導航欄 (極簡風) -->
    <header class="bg-white/90 dark:bg-darkBg/90 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800/80 px-6 py-4 sticky top-0 z-30 transition-colors duration-200">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-2.5 h-2.5 rounded-full bg-zinc-800 dark:bg-white inline-block"></span>
                <h1 class="text-base font-semibold tracking-wider text-zinc-900 dark:text-white uppercase">B-Bot 系統監控</h1>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- 身分標籤 -->
                <div id="user-info-badge" class="hidden items-center space-x-2 text-xs font-mono bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-2.5 py-1 rounded text-zinc-700 dark:text-zinc-300">
                    <i id="user-role-icon" class="fa-solid fa-user-shield"></i>
                    <span id="user-display-name">權限者</span>
                </div>

                <div id="connection-badge" class="flex items-center space-x-2 text-xs text-zinc-500 dark:text-zinc-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-zinc-400 dark:bg-zinc-600"></span>
                    <span id="connection-text">初始化中</span>
                </div>

                <!-- 深淺色模式切換按鈕 -->
                <button id="theme-toggle-btn" class="text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition text-xs px-2.5 py-1 rounded border border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-zinc-900/80 flex items-center space-x-1" title="切換深淺色主題">
                    <i id="theme-toggle-icon" class="fa-solid fa-sun"></i>
                    <span id="theme-toggle-text" class="hidden sm:inline text-[11px] font-mono">白天</span>
                </button>

                <button id="logout-btn" class="hidden text-zinc-600 dark:text-zinc-500 hover:text-rose-600 dark:hover:text-rose-400 transition text-xs font-mono border border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-zinc-900/80 px-2.5 py-1 rounded" title="登出">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
                </button>

                <button onclick="window.location.reload()" class="text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition text-xs p-1" title="重新整理">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區域 -->
    <main id="main-content" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 space-y-6 hidden">

        <!-- 機器人線上狀態卡片 (極簡單線條設計) -->
        <div class="w-full">
            <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800/80 rounded-lg p-6 flex flex-col justify-between shadow-xs dark:shadow-none transition-colors duration-200">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-[11px] font-mono uppercase tracking-widest text-zinc-500 mb-1.5">系統運作狀態</p>
                        <div class="flex items-center space-x-3">
                            <div id="status-indicator-dot" class="w-2.5 h-2.5 rounded-full bg-zinc-400 dark:bg-zinc-600"></div>
                            <h2 id="status-text" class="text-xl font-medium tracking-tight text-zinc-800 dark:text-zinc-200">讀取中...</h2>
                        </div>
                    </div>
                    <span id="status-badge" class="px-2 py-0.5 rounded text-[10px] font-mono font-medium tracking-wider bg-zinc-100 dark:bg-zinc-800/60 text-zinc-500 dark:text-zinc-400 border border-zinc-200 dark:border-zinc-700/50">狀態未知</span>
                </div>
                <div class="mt-6 pt-4 border-t border-zinc-100 dark:border-zinc-800/50 flex flex-wrap items-center justify-between text-xs text-zinc-500 gap-2 font-mono">
                    <div class="truncate">
                        <span id="status-note">無備註紀錄</span>
                    </div>
                    <div class="whitespace-nowrap">
                        <span id="status-time">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制與篩選區塊 -->
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between pt-2">
            
            <!-- 分類標籤頁 (Tabs) -->
            <div class="flex items-center space-x-1.5 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none" id="type-filters">
                <button data-type="ALL" class="filter-tab active px-3 py-1 rounded text-xs font-medium bg-zinc-900 text-white dark:bg-zinc-200 dark:text-zinc-900 transition">全部</button>
                <button data-type="SYSTEM" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">系統</button>
                <button data-type="CHAT" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">對話</button>
                <button data-type="GAME" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">遊戲</button>
                <button data-type="BROADCAST" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">廣播</button>
                <button data-type="ACTION" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">動作</button>
                <button data-type="SECURITY" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">資安</button>
                <button data-type="ERROR" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">錯誤</button>
                <button data-type="DM_REJECTED" class="filter-tab px-3 py-1 rounded text-xs font-medium text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-200 transition">私訊阻擋</button>
            </div>

            <!-- 關鍵字搜尋框 -->
            <div class="relative w-full md:w-64">
                <input type="text" id="search-input" placeholder="搜尋 Log 關鍵字..." class="w-full px-3 py-1.5 bg-white dark:bg-zinc-900/60 border border-zinc-200 dark:border-zinc-800 rounded text-xs text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600 focus:outline-none focus:border-zinc-400 dark:focus:border-zinc-500 transition font-sans shadow-xs dark:shadow-none">
            </div>
        </div>

        <!-- 日誌表格區域 -->
        <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800/80 rounded-lg overflow-hidden shadow-xs dark:shadow-none transition-colors duration-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-zinc-50 dark:bg-zinc-900/40 text-zinc-500 font-mono text-[11px] uppercase border-b border-zinc-200 dark:border-zinc-800/80">
                        <tr>
                            <th class="py-3 px-4 w-44 font-normal">時間戳記</th>
                            <th class="py-3 px-4 w-28 font-normal">類型</th>
                            <th class="py-3 px-4 font-normal">訊息內容</th>
                            <th id="th-details" class="py-3 px-4 w-24 text-right font-normal">詳細內容</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="divide-y divide-zinc-100 dark:divide-zinc-800/40 text-zinc-700 dark:text-zinc-300 font-sans">
                        <!-- 動態插入列 -->
                        <tr>
                            <td colspan="4" class="py-12 text-center text-zinc-400 dark:text-zinc-600 font-mono">
                                正在同步即時日誌資料...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- 底欄資訊 -->
            <div class="px-4 py-2.5 bg-zinc-50 dark:bg-zinc-900/30 border-t border-zinc-100 dark:border-zinc-800/50 flex justify-between items-center text-[11px] font-mono text-zinc-500">
                <span id="filtered-count">0 / 0 筆紀錄</span>
                <span>即時同步中</span>
            </div>
        </div>

        <!-- 底部數據統計指標卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800/80 rounded-lg p-5 shadow-xs dark:shadow-none transition-colors duration-200">
                <span class="text-[11px] font-mono uppercase tracking-widest text-zinc-500 block mb-2">總日誌筆數</span>
                <div id="stat-total-logs" class="text-3xl font-light font-mono text-zinc-900 dark:text-white">0</div>
            </div>

            <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800/80 rounded-lg p-5 shadow-xs dark:shadow-none transition-colors duration-200">
                <span class="text-[11px] font-mono uppercase tracking-widest text-zinc-500 block mb-2">錯誤與資安警告數</span>
                <div id="stat-error-logs" class="text-3xl font-light font-mono text-zinc-700 dark:text-zinc-300">0</div>
            </div>
        </div>

    </main>

    <!-- Log 細節查看 Modal -->
    <div id="details-modal" class="fixed inset-0 z-50 bg-black/60 dark:bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-cardBg border border-zinc-200 dark:border-zinc-800 rounded-lg w-full max-w-xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center bg-zinc-50 dark:bg-zinc-900/50">
                <span class="font-mono text-xs text-zinc-600 dark:text-zinc-400">JSON 原始數據</span>
                <button id="close-modal-btn" class="text-zinc-400 hover:text-zinc-800 dark:hover:text-white transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto font-mono text-xs text-zinc-800 dark:text-zinc-300 bg-zinc-50 dark:bg-zinc-950">
                <pre id="modal-json-content" class="whitespace-pre-wrap break-all"></pre>
            </div>
            <div class="px-4 py-2.5 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900/30 flex justify-end">
                <button id="copy-json-btn" class="px-3 py-1 bg-zinc-200 hover:bg-zinc-300 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 text-xs font-mono rounded transition flex items-center space-x-1.5">
                    <i class="fa-regular fa-copy"></i>
                    <span>複製 JSON</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase JavaScript Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // 帳號權限設定
        const ACCOUNTS = {
            "0515": {
                name: "Bally 管理員",
                role: "admin",
                canViewJson: true,
                iconClass: "fa-solid fa-user-shield text-emerald-400"
            },
            "0216": {
                name: "Ethan 測試員",
                role: "tester",
                canViewJson: false,
                iconClass: "fa-solid fa-user-gear text-amber-400"
            }
        };

        let currentUser = null;

        // 用戶提供的 Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyCNk1vE7vubqoYEtn3HGzeabolYq18619A",
            authDomain: "b-bot-website.firebaseapp.com",
            databaseURL: "https://b-bot-website-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "b-bot-website",
            storageBucket: "b-bot-website.appspot.com",
            messagingSenderId: "508997126688",
            appId: "1:508997126688:web:55fb45728235763e808a45"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let allLogs = [];
        let currentTypeFilter = 'ALL';
        let currentSearchQuery = '';

        // 深淺色主題切換邏輯
        function initThemeToggle() {
            const themeBtn = document.getElementById('theme-toggle-btn');
            const themeIcon = document.getElementById('theme-toggle-icon');
            const themeText = document.getElementById('theme-toggle-text');

            function updateThemeUI() {
                const isDark = document.documentElement.classList.contains('dark');
                if (themeIcon) {
                    themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon text-indigo-500';
                }
                if (themeText) {
                    themeText.innerText = isDark ? '深色' : '淺色';
                }
            }

            updateThemeUI();

            if (themeBtn) {
                themeBtn.addEventListener('click', () => {
                    const isDark = document.documentElement.classList.contains('dark');
                    if (isDark) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('bbot_theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('bbot_theme', 'dark');
                    }
                    updateThemeUI();
                });
            }
        }

        // 身分驗證處理邏輯
        function initAuth() {
            const savedCode = sessionStorage.getItem('bbot_user_code');
            if (savedCode && ACCOUNTS[savedCode]) {
                loginUser(savedCode);
            } else {
                showLoginModal();
            }

            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const pwdInput = document.getElementById('password-input');
                    const errorMsg = document.getElementById('login-error');
                    const inputVal = (pwdInput.value || '').trim();

                    if (ACCOUNTS[inputVal]) {
                        errorMsg.classList.add('hidden');
                        sessionStorage.setItem('bbot_user_code', inputVal);
                        loginUser(inputVal);
                        pwdInput.value = '';
                    } else {
                        errorMsg.classList.remove('hidden');
                        pwdInput.value = '';
                        pwdInput.focus();
                    }
                });
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', logout);
            }
        }

        function loginUser(code) {
            currentUser = ACCOUNTS[code];

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');

            const userBadge = document.getElementById('user-info-badge');
            const userName = document.getElementById('user-display-name');
            const userIcon = document.getElementById('user-role-icon');
            const logoutBtn = document.getElementById('logout-btn');

            if (userBadge && userName && userIcon) {
                userBadge.classList.remove('hidden');
                userBadge.classList.add('flex');
                userName.innerText = currentUser.name;
                userIcon.className = currentUser.iconClass;
            }

            if (logoutBtn) {
                logoutBtn.classList.remove('hidden');
            }

            renderLogsTable();
        }

        function logout() {
            sessionStorage.removeItem('bbot_user_code');
            currentUser = null;

            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('user-info-badge').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');

            showLoginModal();
        }

        function showLoginModal() {
            document.getElementById('login-screen').classList.remove('hidden');
            const input = document.getElementById('password-input');
            if (input) {
                input.value = '';
                input.focus();
            }
        }

        // 各類事件專屬視覺與圖示設定
        const eventConfigs = {
            SYSTEM: {
                icon: 'fa-solid fa-server',
                badgeStyle: 'border border-cyan-200 dark:border-cyan-500/30 text-cyan-800 dark:text-cyan-300 bg-cyan-50 dark:bg-cyan-950/20',
                label: 'SYSTEM'
            },
            CHAT: {
                icon: 'fa-solid fa-comments',
                badgeStyle: 'border border-indigo-200 dark:border-indigo-500/30 text-indigo-800 dark:text-indigo-300 bg-indigo-50 dark:bg-indigo-950/20',
                label: 'CHAT'
            },
            GAME: {
                icon: 'fa-solid fa-gamepad',
                badgeStyle: 'border border-amber-200 dark:border-amber-500/30 text-amber-800 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/20',
                label: 'GAME'
            },
            BROADCAST: {
                icon: 'fa-solid fa-bullhorn',
                badgeStyle: 'border border-purple-200 dark:border-purple-500/30 text-purple-800 dark:text-purple-300 bg-purple-50 dark:bg-purple-950/20',
                label: 'BROADCAST'
            },
            SECURITY: {
                icon: 'fa-solid fa-shield-halved',
                badgeStyle: 'border border-rose-200 dark:border-rose-500/40 text-rose-800 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/30',
                label: 'SECURITY'
            },
            ERROR: {
                icon: 'fa-solid fa-triangle-exclamation',
                badgeStyle: 'border border-red-200 dark:border-red-500/40 text-red-800 dark:text-red-400 bg-red-50 dark:bg-red-950/30',
                label: 'ERROR'
            },
            ACTION: {
                icon: 'fa-solid fa-bolt',
                badgeStyle: 'border border-emerald-200 dark:border-emerald-500/30 text-emerald-800 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/20',
                label: 'ACTION'
            },
            DM_REJECTED: {
                icon: 'fa-solid fa-user-slash',
                badgeStyle: 'border border-zinc-300 dark:border-zinc-700 text-zinc-700 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-900/40',
                label: 'DM REJECT'
            }
        };

        // 1. 監聽機器人狀態 (/status)
        const statusRef = ref(database, 'status');
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            const dot = document.getElementById('status-indicator-dot');
            const statusText = document.getElementById('status-text');
            const statusBadge = document.getElementById('status-badge');
            const statusNote = document.getElementById('status-note');
            const statusTime = document.getElementById('status-time');
            const connBadge = document.getElementById('connection-badge');
            const connText = document.getElementById('connection-text');

            connBadge.className = "flex items-center space-x-2 text-xs text-emerald-600 dark:text-emerald-500 font-mono";
            connText.innerText = "資料庫已連線";

            if (data) {
                const isOnline = data.status === 'online';
                
                if (isOnline) {
                    dot.className = "w-2.5 h-2.5 rounded-full dot-online";
                    statusText.innerText = "線上 (ONLINE)";
                    statusText.className = "text-lg font-mono tracking-wide text-emerald-600 dark:text-emerald-400";
                    statusBadge.className = "px-2 py-0.5 rounded text-[10px] font-mono tracking-wider bg-emerald-100 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800/50";
                    statusBadge.innerText = "運作中";
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full dot-offline";
                    statusText.innerText = "離線 (OFFLINE)";
                    statusText.className = "text-lg font-mono tracking-wide text-rose-600 dark:text-rose-400";
                    statusBadge.className = "px-2 py-0.5 rounded text-[10px] font-mono tracking-wider bg-rose-100 dark:bg-rose-950/40 text-rose-800 dark:text-rose-400 border border-rose-300 dark:border-rose-800/50";
                    statusBadge.innerText = "已停止";
                }

                statusNote.innerText = data.note || '無備註紀錄';
                statusTime.innerText = data.last_updated || '-';
            } else {
                statusText.innerText = "無狀態資料";
                statusNote.innerText = "/status 尚無狀態紀錄";
            }
        }, (error) => {
            console.error("Firebase Status Listener Error:", error);
            document.getElementById('connection-text').innerText = "連線中斷";
        });

        // 2. 監聽 Log 紀錄 (/logs)
        const logsRef = ref(database, 'logs');
        onValue(logsRef, (snapshot) => {
            const data = snapshot.val();
            
            if (!data) {
                allLogs = [];
            } else {
                allLogs = Object.entries(data).map(([key, val]) => ({
                    id: key,
                    ...val
                })).reverse();
            }

            updateStats();
            renderLogsTable();
        });

        // 3. 綁定分類標籤與關鍵字搜尋框事件
        function setupEventListeners() {
            const filterButtons = document.querySelectorAll('.filter-tab');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => {
                        b.classList.remove('bg-zinc-900', 'text-white', 'dark:bg-zinc-200', 'dark:text-zinc-900', 'active');
                        b.classList.add('text-zinc-600', 'dark:text-zinc-400', 'hover:text-zinc-900', 'dark:hover:text-zinc-200');
                    });

                    btn.classList.remove('text-zinc-600', 'dark:text-zinc-400', 'hover:text-zinc-900', 'dark:hover:text-zinc-200');
                    btn.classList.add('bg-zinc-900', 'text-white', 'dark:bg-zinc-200', 'dark:text-zinc-900', 'active');

                    currentTypeFilter = btn.getAttribute('data-type') || 'ALL';
                    renderLogsTable();
                });
            });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    currentSearchQuery = (e.target.value || '').trim().toLowerCase();
                    renderLogsTable();
                });
            }

            // 點擊 Modal 外部背景自動關閉
            const modal = document.getElementById('details-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.classList.add('hidden');
                    }
                });
            }
        }

        initThemeToggle();
        setupEventListeners();
        initAuth();

        function updateStats() {
            const totalElem = document.getElementById('stat-total-logs');
            const errorElem = document.getElementById('stat-error-logs');
            if (totalElem) totalElem.innerText = allLogs.length;
            if (errorElem) {
                const errorCount = allLogs.filter(l => l && (l.type === 'ERROR' || l.type === 'SECURITY')).length;
                errorElem.innerText = errorCount;
            }
        }

        function formatLogMessage(log) {
            const details = log.details || {};
            const type = log.type || 'SYSTEM';

            switch (type) {
                case 'CHAT': {
                    const promptText = details.prompt || details.user_prompt || '';
                    const prompt = promptText ? `<span class="text-zinc-800 dark:text-zinc-200 font-medium">"${escapeHtml(promptText)}"</span>` : '';
                    const response = details.bot_response ? `<div class="mt-1 text-xs text-zinc-700 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-900/60 p-2 rounded border border-zinc-200 dark:border-zinc-800/80 font-sans break-words"><span class="text-indigo-600 dark:text-indigo-400 font-mono text-[10px] mr-1">B-Bot:</span>${escapeHtml(details.bot_response)}</div>` : '';
                    const hasImg = details.has_image ? `<span class="ml-1.5 text-[10px] px-1.5 py-0.5 rounded bg-amber-100 dark:bg-zinc-800 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-500/30"><i class="fa-regular fa-image mr-1"></i>含圖片</span>` : '';

                    return `
                        <div class="flex flex-col">
                            <div class="flex items-center flex-wrap gap-1">
                                <span class="text-zinc-800 dark:text-zinc-300">${escapeHtml(log.message || '')}</span>
                                ${hasImg}
                            </div>
                            ${prompt ? `<div class="mt-1 text-xs text-zinc-700 dark:text-zinc-300"><span class="text-zinc-500 dark:text-zinc-500 text-[11px]">問：</span>${prompt}</div>` : ''}
                            ${response}
                        </div>
                    `;
                }

                case 'GAME': {
                    const gameModText = details.game_mod || details.prompt || '';
                    const gameMod = gameModText ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-300 dark:border-amber-800/50 mr-1.5"><i class="fa-solid fa-chess-board mr-1"></i>內容/模式: ${escapeHtml(gameModText)}</span>` : '';
                    const user = details.user ? `<span class="text-zinc-500 dark:text-zinc-400 text-[11px] font-mono mr-2">@${escapeHtml(details.user)}</span>` : '';

                    return `
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center flex-wrap gap-1">
                                ${gameMod}
                                <span class="text-zinc-800 dark:text-zinc-200 font-medium">${escapeHtml(log.message || '')}</span>
                                ${user}
                            </div>
                        </div>
                    `;
                }

                case 'BROADCAST': {
                    const content = details.content ? `<div class="mt-1 text-xs text-purple-900 dark:text-purple-300/90 bg-purple-50 dark:bg-purple-950/30 p-2 rounded border border-purple-200 dark:border-purple-800/40 font-mono break-words">${escapeHtml(details.content)}</div>` : '';
                    return `
                        <div class="flex flex-col">
                            <span class="text-purple-800 dark:text-purple-300 font-medium"><i class="fa-solid fa-bullhorn mr-1.5"></i>${escapeHtml(log.message || '')}</span>
                            ${content}
                        </div>
                    `;
                }

                case 'SECURITY': {
                    const channelInfo = details.channel_id ? `<span class="ml-2 text-[10px] font-mono text-rose-600 dark:text-rose-400/70">(頻道 ID: ${escapeHtml(details.channel_id)})</span>` : '';
                    const contentInfo = details.content ? `<div class="mt-1 text-[11px] font-mono text-rose-800 dark:text-rose-300/80 bg-rose-100/60 dark:bg-rose-950/20 p-1.5 rounded border border-rose-200 dark:border-rose-900/30">嘗試觸發內容: "${escapeHtml(details.content)}"</div>` : '';
                    return `
                        <div class="flex flex-col bg-rose-50 dark:bg-rose-950/10 border border-rose-200 dark:border-rose-900/30 p-2 rounded text-rose-900 dark:text-rose-200">
                            <div class="flex items-center">
                                <i class="fa-solid fa-shield-halved text-rose-600 dark:text-rose-400 mr-1.5 text-xs"></i>
                                <span class="font-medium text-rose-800 dark:text-rose-300">${escapeHtml(log.message || '')}</span>
                                ${channelInfo}
                            </div>
                            ${contentInfo}
                        </div>
                    `;
                }

                case 'ERROR': {
                    const promptInfo = details.prompt ? `<div class="mt-1 text-[11px] text-red-700 dark:text-red-300/80 font-mono">觸發提示詞: ${escapeHtml(details.prompt)}</div>` : '';
                    return `
                        <div class="flex flex-col">
                            <span class="text-red-600 dark:text-red-400 font-medium"><i class="fa-solid fa-circle-exclamation mr-1"></i>${escapeHtml(log.message || '')}</span>
                            ${promptInfo}
                        </div>
                    `;
                }

                case 'ACTION': {
                    const user = details.user ? `<span class="text-emerald-700 dark:text-emerald-400/80 text-[11px] font-mono ml-2">由 @${escapeHtml(details.user)} 觸發</span>` : '';
                    return `
                        <div class="flex items-center">
                            <span class="text-emerald-800 dark:text-emerald-300">${escapeHtml(log.message || '')}</span>
                            ${user}
                        </div>
                    `;
                }

                case 'DM_REJECTED': {
                    const content = details.content ? `<div class="mt-1 text-[11px] text-zinc-500 font-mono italic">" ${escapeHtml(details.content)} "</div>` : '';
                    return `
                        <div class="flex flex-col">
                            <span class="text-zinc-600 dark:text-zinc-400">${escapeHtml(log.message || '')}</span>
                            ${content}
                        </div>
                    `;
                }

                case 'SYSTEM':
                default: {
                    const botUser = details.bot_user ? `<span class="text-cyan-700 dark:text-cyan-400/80 text-[11px] font-mono ml-2">(${escapeHtml(details.bot_user)})</span>` : '';
                    const user = details.user ? `<span class="text-zinc-500 dark:text-zinc-400 text-[11px] font-mono ml-2">操作者: @${escapeHtml(details.user)}</span>` : '';
                    return `
                        <div class="flex items-center">
                            <span class="text-zinc-800 dark:text-zinc-200">${escapeHtml(log.message || '')}</span>
                            ${botUser}
                            ${user}
                        </div>
                    `;
                }
            }
        }

        function renderLogsTable() {
            const tbody = document.getElementById('logs-table-body');
            if (!tbody) return;
            
            const canViewJson = currentUser ? currentUser.canViewJson : false;

            // 根據權限決定是否顯示「詳細內容」表頭欄位
            const thDetails = document.getElementById('th-details');
            if (thDetails) {
                if (canViewJson) {
                    thDetails.classList.remove('hidden');
                } else {
                    thDetails.classList.add('hidden');
                }
            }

            const colSpanCount = canViewJson ? 4 : 3;

            const filtered = allLogs.filter(log => {
                if (!log) return false;
                const matchType = currentTypeFilter === 'ALL' || log.type === currentTypeFilter;
                
                let matchSearch = true;
                if (currentSearchQuery) {
                    const msg = String(log.message || '').toLowerCase();
                    const detailsStr = JSON.stringify(log.details || {}).toLowerCase();
                    const typeStr = String(log.type || '').toLowerCase();
                    const idStr = String(log.id || '').toLowerCase();
                    matchSearch = msg.includes(currentSearchQuery) || 
                                  detailsStr.includes(currentSearchQuery) || 
                                  typeStr.includes(currentSearchQuery) ||
                                  idStr.includes(currentSearchQuery);
                }
                
                return matchType && matchSearch;
            });

            const countElem = document.getElementById('filtered-count');
            if (countElem) countElem.innerText = `${filtered.length} / ${allLogs.length} 筆紀錄`;

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${colSpanCount}" class="py-12 text-center text-zinc-600 font-mono">
                            沒有符合當前條件的日誌。
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(log => {
                const config = eventConfigs[log.type] || {
                    icon: 'fa-solid fa-circle-info',
                    badgeStyle: 'border border-zinc-800 text-zinc-400 bg-zinc-900/30',
                    label: log.type || 'INFO'
                };

                const hasDetails = log.details && typeof log.details === 'object' && Object.keys(log.details).length > 0;
                
                // 若具備 JSON 檢視權限 (Bally)，才渲染「詳細內容」與專屬「複製」按鈕
                const detailsCellHtml = canViewJson ? `
                    <td class="py-3 px-4 text-right align-top">
                        <div class="flex flex-col items-end space-y-1">
                            ${hasDetails ? `
                                <button onclick="openModal('${escapeHtml(log.id)}')" class="px-2 py-0.5 bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-900 dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200 border border-zinc-300 dark:border-zinc-800 rounded text-[11px] font-mono transition inline-flex items-center space-x-1 cursor-pointer">
                                    <i class="fa-solid fa-code text-[10px]"></i>
                                    <span>JSON</span>
                                </button>
                            ` : `<span class="text-zinc-400 dark:text-zinc-700 text-xs mb-0.5">-</span>`}
                            
                            <!-- Bally 專屬一鍵複製按鈕 -->
                            <button onclick="copyLogEntry('${escapeHtml(log.id)}', this)" class="px-2 py-0.5 bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-900 dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-400 dark:hover:text-zinc-200 border border-zinc-300 dark:border-zinc-800 rounded text-[11px] font-mono transition inline-flex items-center space-x-1 cursor-pointer" title="複製此筆 Log">
                                <i class="fa-regular fa-copy text-[10px]"></i>
                                <span>複製</span>
                            </button>
                        </div>
                    </td>
                ` : '';

                return `
                    <tr class="hover:bg-zinc-100/80 dark:hover:bg-zinc-800/20 transition">
                        <td class="py-3 px-4 font-mono text-[11px] text-zinc-500 whitespace-nowrap align-top">
                            ${escapeHtml(log.timestamp || '-')}
                        </td>
                        <td class="py-3 px-4 align-top">
                            <span class="inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[10px] font-mono tracking-wider ${config.badgeStyle}">
                                <i class="${config.icon} text-[9px] mr-0.5"></i>
                                <span>${escapeHtml(config.label)}</span>
                            </span>
                        </td>
                        <td class="py-3 px-4 text-zinc-800 dark:text-zinc-200 align-top">
                            ${formatLogMessage(log)}
                        </td>
                        ${detailsCellHtml}
                    </tr>
                `;
            }).join('');
        }

        // Modal 操作邏輯
        window.openModal = function(id) {
            if (!currentUser || !currentUser.canViewJson) return;

            const targetLog = allLogs.find(l => l.id === id);
            if (!targetLog) return;

            const modal = document.getElementById('details-modal');
            const jsonElem = document.getElementById('modal-json-content');
            
            jsonElem.innerText = JSON.stringify(targetLog.details || {}, null, 2);
            modal.classList.remove('hidden');
        };

        // 一鍵複製單筆 Log 內容 (不再附帶 JSON 詳細資料)
        window.copyLogEntry = function(id, btnElement) {
            if (!currentUser || !currentUser.canViewJson) return;

            const targetLog = allLogs.find(l => l.id === id);
            if (!targetLog) return;

            let copyContent = `[${targetLog.timestamp || '-'}] [${targetLog.type || 'INFO'}] ${targetLog.message || ''}`;

            const tempInput = document.createElement('textarea');
            tempInput.value = copyContent;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-check text-emerald-500 text-[10px]"></i><span class="text-emerald-500 font-medium">已複製</span>`;
            setTimeout(() => {
                btnElement.innerHTML = originalHtml;
            }, 1500);
        };

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('details-modal').classList.add('hidden');
        });

        document.getElementById('copy-json-btn').addEventListener('click', () => {
            const jsonText = document.getElementById('modal-json-content').innerText;
            const tempInput = document.createElement('textarea');
            tempInput.value = jsonText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const copyBtn = document.getElementById('copy-json-btn');
            copyBtn.innerHTML = `<i class="fa-solid fa-check"></i><span>已複製！</span>`;
            setTimeout(() => {
                copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i><span>複製 JSON</span>`;
            }, 2000);
        });

        // HTML 轉義防止 XSS
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
